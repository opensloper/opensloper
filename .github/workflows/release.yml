# Builds OpenSloper for Linux, macOS and Windows on every push to the release
# branch, each as an archive and an installer (.deb, .dmg, setup.exe) with the
# offline user guide, and publishes the downloads as the GitHub release of the version in
# Sloper.Core.Version (tag vVERSION), which must be a release version, not
# VERSION+dev. Until the version changes, each push
# replaces that release's downloads and moves its tag to the new commit; a
# 0.x version is marked as a pre-release.
#
# Run it by hand (Actions -> Release -> Run workflow) on any branch to try the
# builds: they are kept as workflow artifacts, and only the release branch
# publishes them.
#
# Toolchains are the Lazarus 4.8 releases, checked against SHA-256 sums taken
# from downloads that matched the MD5 sums on lazarus-ide.org: on Linux FPC
# 3.2.2 (as in ci.yml), on Windows the installer with FPC 3.2.2, and on macOS
# the Lazarus 4.8 build with the FPC 3.2.4rc1 package it is released with, as
# FPC 3.2.2 does not support current macOS.
name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

# A release being published is never cancelled part way
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  LAZARUS_RELEASE: "4.8"

jobs:
  # The offline copy of the user guide, which every download ships in data/help.
  # The reference pages are committed, so no Pascal build is needed.
  user-guide:
    name: Offline user guide
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Build the offline site
        run: ./opensloper-make.sh docs --offline

      - uses: actions/upload-artifact@v7
        with:
          name: user-guide
          path: release/site_offline
          if-no-files-found: error

  linux:
    name: Linux x86_64
    needs: user-guide
    runs-on: ubuntu-24.04
    env:
      LAZARUS_DEBS: >-
        fpc-laz_3.2.2-210709_amd64.deb
        fpc-src_3.2.2-210709_amd64.deb
        lazarus-project_4.8.0-0_amd64.deb
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache the Lazarus packages
        id: debs
        uses: actions/cache@v6
        with:
          path: debs
          key: lazarus-debs-${{ env.LAZARUS_RELEASE }}

      - name: Download the Lazarus packages
        if: steps.debs.outputs.cache-hit != 'true'
        run: |
          mkdir -p debs
          base="https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20amd64%20DEB/Lazarus%20${LAZARUS_RELEASE}"
          for deb in $LAZARUS_DEBS; do
            curl -fsSL --retry 5 --retry-delay 10 -o "debs/$deb" "$base/$deb/download"
          done

      - name: Verify and install FPC, Lazarus and Qt6
        run: |
          cd debs
          sha256sum -c <<'EOF'
          92000f2b831184e153aab0c910f8ae9240450e5c6d76dc189cf53116ee501d83  fpc-laz_3.2.2-210709_amd64.deb
          8c9e145d8056754a9ca39ce3e52e982b8e4816124984c5f542f2a874e721ad53  fpc-src_3.2.2-210709_amd64.deb
          401742cefb01ad99a628188034bf728fb5360d641ed2be5f91fb0ee183a301cd  lazarus-project_4.8.0-0_amd64.deb
          EOF
          cd ..
          sudo apt-get update -q
          sudo apt-get install -y -q $(for deb in $LAZARUS_DEBS; do echo "./debs/$deb"; done) \
            qt6-base-dev qt6-qpa-plugins patchelf xvfb desktop-file-utils
          fpc -iV
          lazbuild --version

      # Ubuntu packages them only from 26.04, so they are built from Lazarus's
      # own sources for its Qt6 widgetset, and shipped in the download
      - name: Build the Qt6 Pascal bindings
        run: |
          # The .deb puts Lazarus in /usr/share/lazarus/VERSION
          src=$(find /usr/share/lazarus /usr/lib/lazarus -type d -path '*/lcl/interfaces/qt6/cbindings' 2>/dev/null | head -1)
          if [ -z "$src" ]; then
            echo "::error::The Qt6 binding sources (lcl/interfaces/qt6/cbindings) are not in the Lazarus install"
            exit 1
          fi
          cp -R "$src" "$RUNNER_TEMP/qt6pas"
          cd "$RUNNER_TEMP/qt6pas"
          qmake6 Qt6Pas.pro
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
          echo "BUNDLE_LIBS=$(ldconfig -p | sed -n 's/.*libQt6Pas\.so\.6 .*=> //p' | head -1)" >> "$GITHUB_ENV"

      - name: Tests and leak check
        run: ./opensloper-make.sh test

      - name: Build
        env:
          LCL_WIDGETSET: qt6
        run: ./opensloper-make.sh build

      - uses: actions/download-artifact@v8
        with:
          name: user-guide
          path: release/site_offline

      - name: Package
        run: ./opensloper-make.sh package

      # From outside the source tree, so the data must come from the download,
      # and with the bindings built here removed, so they must come from it too
      - name: Try the download
        run: |
          sudo rm -f /usr/lib/x86_64-linux-gnu/libQt6Pas.so*
          sudo ldconfig
          mkdir -p "$RUNNER_TEMP/try"
          tar -C "$RUNNER_TEMP/try" -xzf release/dist/*.tar.gz
          cd "$RUNNER_TEMP"/try/opensloper-*
          ldd ./opensloper-design | grep 'libQt6Pas.so.6 => .*/lib/libQt6Pas.so.6'
          test -f data/help/index.html
          ./opensloper-cli --version
          ./opensloper-cli check "$GITHUB_WORKSPACE/docs/examples/skirt-block/skirt-block.sloper" \
            -m "$GITHUB_WORKSPACE/docs/examples/skirt-block/skirt.slm"
          # The assistant's HTTPS: OpenSSL loads and the API's certificate is trusted
          ./opensloper-cli check-connection
          # Still running after 15 seconds means it started
          status=0
          timeout 15 xvfb-run -a ./opensloper-design || status=$?
          if [ "$status" -ne 124 ]; then
            echo "::error::opensloper-design exited with $status during start-up"
            exit 1
          fi

      # Installed from the .deb, run from the PATH, and removed again; the
      # bindings must still come from the download
      - name: Try the .deb
        run: |
          sudo apt-get install -y -q ./release/dist/opensloper_*_amd64.deb
          ldd /usr/lib/opensloper/opensloper-design | grep 'libQt6Pas.so.6 => /usr/lib/opensloper/lib/libQt6Pas.so.6'
          test -f /usr/lib/opensloper/data/help/index.html
          grep -q 'application/x-opensloper-pattern' /usr/share/mime/globs2
          desktop-file-validate /usr/share/applications/opensloper-*.desktop
          cd "$RUNNER_TEMP"
          opensloper-cli --version
          opensloper-cli check "$GITHUB_WORKSPACE/docs/examples/skirt-block/skirt-block.sloper" \
            -m "$GITHUB_WORKSPACE/docs/examples/skirt-block/skirt.slm"
          opensloper-cli check-connection
          status=0
          timeout 15 xvfb-run -a opensloper-design || status=$?
          if [ "$status" -ne 124 ]; then
            echo "::error::opensloper-design from the .deb exited with $status during start-up"
            exit 1
          fi
          sudo apt-get remove -y -q opensloper
          test ! -e /usr/bin/opensloper-design

      - uses: actions/upload-artifact@v7
        with:
          name: opensloper-linux-x86_64
          path: release/dist/*
          if-no-files-found: error

  macos:
    name: macOS arm64
    needs: user-guide
    # The current Apple silicon image: GitHub retires older ones (macos-14 is gone)
    runs-on: macos-latest
    env:
      LAZARUS_ZIP: lazarus-darwin-aarch64-4.8.zip
      FPC_DMG: fpc-3.2.4rc1a.intelarm64-macosx.dmg
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Saved as soon as it is downloaded, as it is slow (20 minutes or more),
      # so a build that fails later does not download it again
      - name: Restore the Lazarus downloads
        id: downloads
        uses: actions/cache/restore@v6
        with:
          path: downloads
          key: lazarus-macos-arm64-${{ env.LAZARUS_RELEASE }}

      - name: Download Lazarus and FPC
        if: steps.downloads.outputs.cache-hit != 'true'
        run: |
          mkdir -p downloads
          base="https://sourceforge.net/projects/lazarus/files/Lazarus%20macOS%20aarch64/Lazarus%20${LAZARUS_RELEASE}"
          for file in "$LAZARUS_ZIP" "$FPC_DMG"; do
            curl -fsSL --retry 5 --retry-delay 10 -C - -o "downloads/$file" "$base/$file/download"
          done
          cd downloads
          shasum -a 256 -c <<'EOF'
          e5e0bf52bca911d4605dc875bd924ff5c74a0d0f6cf5699b936b377cc1986d1b  lazarus-darwin-aarch64-4.8.zip
          e7792c59a31982a00021566d1ab63b0c794ff87d63b6123fe0f45e8f5627f798  fpc-3.2.4rc1a.intelarm64-macosx.dmg
          EOF

      - name: Save the Lazarus downloads
        if: steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: downloads
          key: lazarus-macos-arm64-${{ env.LAZARUS_RELEASE }}

      - name: Verify and install FPC and Lazarus
        run: |
          cd downloads
          shasum -a 256 -c <<'EOF'
          e5e0bf52bca911d4605dc875bd924ff5c74a0d0f6cf5699b936b377cc1986d1b  lazarus-darwin-aarch64-4.8.zip
          e7792c59a31982a00021566d1ab63b0c794ff87d63b6123fe0f45e8f5627f798  fpc-3.2.4rc1a.intelarm64-macosx.dmg
          EOF
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/fpc-dmg" "$FPC_DMG"
          sudo installer -pkg "$(find "$RUNNER_TEMP/fpc-dmg" -name '*.pkg' | head -1)" -target /
          hdiutil detach "$RUNNER_TEMP/fpc-dmg"
          unzip -q "$LAZARUS_ZIP" -d "$RUNNER_TEMP"
          cd ..
          brew install librsvg
          fpc -iV
          echo "LAZBUILD=$RUNNER_TEMP/lazarus/lazbuild" >> "$GITHUB_ENV"
          echo "LAZARUS_PCP=$RUNNER_TEMP/lazarus-config" >> "$GITHUB_ENV"

      # The linker of Xcode 15 and later rejects the Objective-C method lists
      # FPC writes for the Cocoa widgetset ("malformed method list atom"), so
      # FPC links with the classic one. When this Xcode has none, the newest
      # installed Xcode that has it is chosen.
      - name: Link with the classic linker
        run: |
          has_classic() {
            echo 'int main(void) { return 0; }' | xcrun cc -x c - -Wl,-ld_classic -o "$RUNNER_TEMP/ld-test" 2>/dev/null
          }
          if ! has_classic; then
            for xcode in $(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -rV); do
              sudo xcode-select -s "$xcode/Contents/Developer"
              has_classic && break
            done
            if ! has_classic; then
              echo "::error::No installed Xcode has the classic linker (-ld_classic) that FPC's Cocoa code needs"
              exit 1
            fi
          fi
          xcode-select -p
          # FPC reads ~/.fpc.cfg in place of the installed fpc.cfg, so it
          # includes that one first
          for cfg in /etc/fpc.cfg /usr/local/etc/fpc.cfg; do
            [ -f "$cfg" ] && echo "#INCLUDE $cfg" >> ~/.fpc.cfg && break
          done
          echo '-k-ld_classic' >> ~/.fpc.cfg
          cat ~/.fpc.cfg

      - name: Build
        run: ./opensloper-make.sh build --lazarusdir="$RUNNER_TEMP/lazarus" --compiler="$(command -v fpc)"

      - uses: actions/download-artifact@v8
        with:
          name: user-guide
          path: release/site_offline

      - name: Package
        run: ./opensloper-make.sh package

      - name: Try the download
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/try" release/dist/*.dmg
          cd "$RUNNER_TEMP"/try/OpenSloper.app/Contents/MacOS
          test -L "$RUNNER_TEMP/try/Applications"
          codesign --verify --deep --strict ../..
          plutil -lint ../Info.plist
          test -f ../Resources/data/help/index.html
          test -f ../Resources/data/cacert.pem
          ./opensloper-cli --version
          # The bundled OpenSSL and certificates, not Homebrew's
          status=0
          ./opensloper-cli check-connection > "$RUNNER_TEMP/connection.txt" || status=$?
          cat "$RUNNER_TEMP/connection.txt"
          test "$status" -eq 0
          grep -q "data/cacert.pem" "$RUNNER_TEMP/connection.txt"
          ./opensloper-cli check "$GITHUB_WORKSPACE/docs/examples/skirt-block/skirt-block.sloper" \
            -m "$GITHUB_WORKSPACE/docs/examples/skirt-block/skirt.slm"
          ./opensloper-design &
          app=$!
          sleep 15
          if ! kill -0 "$app" 2>/dev/null; then
            wait "$app" || status=$?
            echo "::error::opensloper-design exited with ${status:-0} during start-up"
            exit 1
          fi
          kill "$app"
          cd "$RUNNER_TEMP"
          hdiutil detach "$RUNNER_TEMP/try"

      - uses: actions/upload-artifact@v7
        with:
          name: opensloper-macos-arm64
          path: release/dist/*
          if-no-files-found: error

  windows:
    name: Windows x86_64
    needs: user-guide
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      LAZARUS_EXE: lazarus-4.8-fpc-3.2.2-win64.exe
      LAZARUS_DIR: C:\lazarus
    steps:
      # The shell scripts must keep their Unix line ends
      - name: Keep line ends
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache the Lazarus installer
        id: downloads
        uses: actions/cache@v6
        with:
          path: downloads
          key: lazarus-windows-x86_64-${{ env.LAZARUS_RELEASE }}

      - name: Download the Lazarus installer
        if: steps.downloads.outputs.cache-hit != 'true'
        run: |
          mkdir -p downloads
          base="https://sourceforge.net/projects/lazarus/files/Lazarus%20Windows%2064%20bits/Lazarus%20${LAZARUS_RELEASE}"
          curl -fsSL --retry 5 --retry-delay 10 -o "downloads/$LAZARUS_EXE" "$base/$LAZARUS_EXE/download"

      - name: Verify the Lazarus installer
        run: |
          cd downloads
          sha256sum -c <<'EOF'
          ed25ee171d55e23cf14e0633159fdd2325efba56e186f8ab817ad3bf97d267d7  lazarus-4.8-fpc-3.2.2-win64.exe
          EOF

      - name: Install Lazarus
        shell: pwsh
        run: |
          $installer = Start-Process -FilePath "downloads\$env:LAZARUS_EXE" -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$env:LAZARUS_DIR"
          if ($installer.ExitCode -ne 0) { throw "The Lazarus installer exited with $($installer.ExitCode)" }
          & "$env:LAZARUS_DIR\fpc\3.2.2\bin\x86_64-win64\fpc.exe" -iV

      - name: Install Inno Setup
        run: |
          if [ ! -x "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup -y --no-progress
          fi

      - name: Build
        env:
          LAZBUILD: C:/lazarus/lazbuild.exe
        run: |
          ./opensloper-make.sh build --pcp="$RUNNER_TEMP/lazarus-config" --lazarusdir=C:/lazarus \
            --compiler=C:/lazarus/fpc/3.2.2/bin/x86_64-win64/fpc.exe

      - uses: actions/download-artifact@v8
        with:
          name: user-guide
          path: release/site_offline

      - name: Package
        env:
          STRIP: C:/lazarus/fpc/3.2.2/bin/x86_64-win64/strip.exe
        run: ./opensloper-make.sh package

      - name: Try the download
        run: |
          TRY="$(cygpath -u "$RUNNER_TEMP")/try"
          EXAMPLE="$(cygpath -u "$GITHUB_WORKSPACE")/docs/examples/skirt-block"
          mkdir -p "$TRY"
          7z x -bso0 -o"$TRY" release/dist/*.zip
          cd "$TRY"/opensloper-*
          test -f data/help/index.html
          ./opensloper-cli.exe --version
          ./opensloper-cli.exe check "$EXAMPLE/skirt-block.sloper" -m "$EXAMPLE/skirt.slm"

      - name: Try starting the design app
        shell: pwsh
        run: |
          $folder = Get-ChildItem "$env:RUNNER_TEMP\try" -Directory | Select-Object -First 1
          # Here rather than in Git Bash, whose PATH has Git's own OpenSSL
          $said = & (Join-Path $folder.FullName 'opensloper-cli.exe') check-connection
          $said
          if ($LASTEXITCODE -ne 0) { throw 'The download cannot reach the Claude API' }
          if (-not ($said -match 'cacert\.pem')) { throw 'The download does not trust its own certificates' }
          $app = Start-Process -FilePath (Join-Path $folder.FullName 'opensloper-design.exe') -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "opensloper-design exited with $($app.ExitCode) during start-up" }
          Stop-Process -Id $app.Id

      # For the current user, as most will install it, then uninstalled again
      - name: Try the installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem release\dist\*-setup.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'installed'
          $run = Start-Process -FilePath $setup.FullName -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir"
          if ($run.ExitCode -ne 0) { throw "The installer exited with $($run.ExitCode)" }
          if (-not (Test-Path (Join-Path $dir 'data\help\index.html'))) { throw 'No user guide installed' }
          $command = (Get-ItemProperty 'HKCU:\Software\Classes\OpenSloper.Pattern\shell\open\command').'(default)'
          if ($command -notlike '*opensloper-design.exe*') { throw "Patterns open with $command" }
          & (Join-Path $dir 'opensloper-cli.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'opensloper-cli did not run' }
          & (Join-Path $dir 'opensloper-cli.exe') check-connection
          if ($LASTEXITCODE -ne 0) { throw 'The installed programs cannot reach the Claude API' }
          $app = Start-Process -FilePath (Join-Path $dir 'opensloper-design.exe') -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "The installed opensloper-design exited with $($app.ExitCode) during start-up" }
          Stop-Process -Id $app.Id
          Start-Sleep -Seconds 2
          $run = Start-Process -FilePath (Join-Path $dir 'unins000.exe') -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($run.ExitCode -ne 0) { throw "The uninstaller exited with $($run.ExitCode)" }
          # The uninstaller finishes in a copy of itself
          Start-Sleep -Seconds 5
          if (Test-Path 'HKCU:\Software\Classes\OpenSloper.Pattern') { throw 'The file type is still registered' }

      - uses: actions/upload-artifact@v7
        with:
          name: opensloper-windows-x86_64
          path: release/dist/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [linux, macos, windows]
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # All of the history and tags, for the commits since the last release
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # The downloads, not the user guide they were made with
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: opensloper-*
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n "s/^ *APP_VERSION = '\(.*\)';.*/\1/p" src/core/sloper.core.version.pas)
          # A development version (0.10.0+dev) is never published: choose the
          # release's version first with opensloper-make.sh bump
          if ! [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::APP_VERSION $VERSION is not a release version: run opensloper-make.sh bump major|minor|patch first"
            exit 1
          fi
          TAG="v$VERSION"
          PRERELEASE=false
          case "$VERSION" in 0.*) PRERELEASE=true ;; esac
          {
            ./opensloper-make.sh release "$VERSION"
            echo
            echo "## Downloads"
            echo
            echo "Built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d)."
            echo
            echo "| Download | For |"
            echo "| --- | --- |"
            echo "| \`opensloper_${VERSION}_amd64.deb\` | Debian 13, Ubuntu 24.04 and later, x86_64: installs with menu entries and file types |"
            echo "| \`opensloper-$VERSION-linux-x86_64.tar.gz\` | Linux x86_64, to run from a folder; needs Qt 6.4 or later (the Qt6 Pascal bindings are included) |"
            echo "| \`opensloper-$VERSION-macos-arm64.dmg\` | macOS 11 or later on Apple silicon |"
            echo "| \`opensloper-$VERSION-windows-x86_64-setup.exe\` | Windows 10 or later, 64-bit: installs with Start menu entries and file types |"
            echo "| \`opensloper-$VERSION-windows-x86_64.zip\` | Windows 10 or later, 64-bit, to run from a folder |"
            echo
            echo "Each has the user guide to read offline (Help, User Guide)."
            echo
            echo "The programs are not signed: on macOS run \`xattr -cr OpenSloper.app\` once if it will not open,"
            echo "and on Windows choose More info, then Run anyway. README.txt in each download says more."
          } > notes.md
          # The tag follows the release branch until the version changes
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "OpenSloper $VERSION" --notes-file notes.md --prerelease="$PRERELEASE"
          else
            gh release create "$TAG" --title "OpenSloper $VERSION" --notes-file notes.md --prerelease="$PRERELEASE" --verify-tag
          fi
          gh release upload "$TAG" dist/* --clobber

  # The docs at docs.opensloper.com follow the release: built again once it is
  # published, the root from this branch and /dev/ from development
  docs:
    name: Publish the docs
    needs: publish
    permissions:
      # write: the deploy makes a commit to deploy under (docs.yml)
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
