# For the ISPConfig site's Options tab, "Apache Directives". Apache serves the
# static files and the web apps itself and passes everything else to gunicorn
# (opensloper-site.service). Needs mod_proxy, mod_proxy_http, mod_headers and
# mod_rewrite (a2enmod proxy proxy_http headers rewrite). deploy.sh fills in
# @SITE_DIR@ in its copy on the server; paste that one.

# One address for search engines: http and the bare domain go to https://www.
RewriteEngine On
RewriteCond %{HTTPS} off [OR]
RewriteCond %{HTTP_HOST} !^www\.opensloper\.com$ [NC]
RewriteRule ^ https://www.opensloper.com%{REQUEST_URI} [R=301,L]

AddType application/wasm .wasm
AddType application/manifest+json .webmanifest

# The site's CSS and pictures (manage.py collectstatic puts them here)
Alias /static/ @SITE_DIR@/static_root/
<Directory @SITE_DIR@/static_root>
    Require all granted
    Header set Cache-Control "public, max-age=86400"
</Directory>

# The web Design app, as import_opensloper copied it. The page and its service
# worker are checked on every visit, so a new build is offered at once; the
# service worker keeps the rest for offline use.
Alias /design/ @SITE_DIR@/imported/apps/design/
<Directory @SITE_DIR@/imported/apps/design>
    Require all granted
    DirectoryIndex index.html
    Header set Cache-Control "no-cache"
</Directory>

# The web Publish app, likewise, with a service worker of its own
Alias /publish/ @SITE_DIR@/imported/apps/publish/
<Directory @SITE_DIR@/imported/apps/publish>
    Require all granted
    DirectoryIndex index.html
    Header set Cache-Control "no-cache"
</Directory>

# The web Measurements app, likewise
Alias /measurements/ @SITE_DIR@/imported/apps/measurements/
<Directory @SITE_DIR@/imported/apps/measurements>
    Require all granted
    DirectoryIndex index.html
    Header set Cache-Control "no-cache"
</Directory>

# Everything else is Django's: the pages, the apps without their slash, robots.txt.
# /stats/ stays with Apache: ISPConfig's AWStats reports in the site's web
# folder, behind the password ISPConfig sets for them.
ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
ProxyPass /static/ !
ProxyPass /design/ !
ProxyPass /publish/ !
ProxyPass /measurements/ !
ProxyPass /stats/ !
ProxyPass / http://127.0.0.1:8001/
ProxyPassReverse / http://127.0.0.1:8001/
